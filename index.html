<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma surpresa para você ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffe5ec,#fff5f7);overflow:hidden;color:#5b2634}.screen{width:min(92vw,560px);min-height:560px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative}button{border:0;cursor:pointer;font:inherit;transition:transform .2s ease,box-shadow .2s ease}#moveBtn{position:absolute;padding:16px 30px;border-radius:999px;background:#ff5c7c;color:white;font-weight:700;font-size:18px;box-shadow:0 10px 25px rgba(255,92,124,.25)}#moveBtn:hover{transform:scale(1.05)}#heartBtn{display:none;width:150px;height:150px;background:transparent;font-size:105px;line-height:1;filter:drop-shadow(0 12px 18px rgba(214,45,84,.25));animation:pulse 1.15s infinite}#final{display:none;flex-direction:column;align-items:center;gap:16px;animation:appear .7s ease}#final img{width:min(88vw,430px);max-height:62vh;object-fit:cover;border-radius:22px;box-shadow:0 18px 45px rgba(100,30,50,.25)}#message{margin:0;font-size:clamp(34px,8vw,58px);font-weight:800;color:#e52f5a;text-shadow:0 3px 12px rgba(229,47,90,.15)}.hint{font-size:16px;opacity:.75;margin-top:-4px}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes appear{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}.heart-float{position:fixed;bottom:-30px;font-size:22px;opacity:.45;animation:float 7s linear infinite;pointer-events:none}@keyframes float{from{transform:translateY(0) translateX(0);opacity:0}15%{opacity:.45}to{transform:translateY(-110vh) translateX(60px);opacity:0}}
</style></head>
<body><div class="screen" id="screen">
<button id="moveBtn">CLIQUE AQUI ❤️</button><button id="heartBtn" aria-label="Abrir surpresa">❤️</button>
<div id="final"><img src="https://raw.githubusercontent.com/bryanlucas-cyber/supresa/main/foto.jpg" alt="Foto especial"><h1 id="message">EU TE AMO ❤️</h1><div class="hint">Essa surpresa era só para você.</div></div>
</div>
<script>
const screen=document.getElementById('screen'),moveBtn=document.getElementById('moveBtn'),heartBtn=document.getElementById('heartBtn'),final=document.getElementById('final');let clicks=0;
function moveButton(){const maxX=Math.max(20,screen.clientWidth-moveBtn.offsetWidth-20),maxY=Math.max(20,screen.clientHeight-moveBtn.offsetHeight-20);moveBtn.style.left=(20+Math.random()*(maxX-20))+'px';moveBtn.style.top=(20+Math.random()*(maxY-20))+'px'}
moveBtn.addEventListener('click',()=>{clicks++;if(clicks===1){moveButton();moveBtn.textContent='CLIQUE AQUI DE NOVO 😏'}else{moveBtn.style.display='none';heartBtn.style.display='block'}});
heartBtn.addEventListener('click',()=>{heartBtn.style.display='none';final.style.display='flex';for(let i=0;i<18;i++){const h=document.createElement('span');h.className='heart-float';h.textContent='❤️';h.style.left=Math.random()*100+'vw';h.style.animationDelay=Math.random()*3+'s';h.style.fontSize=16+Math.random()*24+'px';document.body.appendChild(h)}});
window.addEventListener('load',moveButton);
</script></body></html>
